[project]
name = "mergescribe"
version = "2.0.0"
description = "Local-first macOS voice-to-text with parallel STT providers, LLM correction, and voice-driven output routing"
authors = [
    {name = "Kalpit Sutariya"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "soundfile==0.12.1",
    "numpy>=2.2.5",
    "sounddevice==0.5.0",
    "pynput==1.7.7",
    "rumps>=0.4.0",
    "pyobjc-framework-Quartz>=10.2",
    "pyobjc-framework-ApplicationServices>=10.2",
    "parakeet-mlx",
    "requests>=2.31.0",
]




[project.optional-dependencies]
dev = ["ruff>=0.6.9", "pytest>=8.3.2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pin the rule set instead of inheriting ruff's defaults: those widen between
# releases, and CI installs the latest ruff, so "the defaults" is not a stable
# contract. Broad `except` clauses are deliberate here (a failing HUD or metrics
# write must never take recording down), so the rules that ban them stay off.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# So a bare `pytest` finds the package, not just `python -m pytest` (which puts
# the working directory on sys.path itself).
pythonpath = ["."]
